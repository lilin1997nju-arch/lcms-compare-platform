<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在启动 LC-MS/MS 分析平台</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#edf4fb;color:#17253d}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 72% 22%,rgba(37,99,235,.12),transparent 36%),#edf4fb}
    main{width:min(520px,calc(100vw - 40px));padding:34px;border:1px solid #d5e4f3;border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 24px 60px rgba(31,58,92,.13)}
    .brand{display:flex;gap:14px;align-items:center}.mark{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;color:#fff;font-size:23px;font-weight:800;background:linear-gradient(145deg,#2563eb,#0ea5b7)}
    h1{margin:0;font-size:22px}.sub{margin:5px 0 0;color:#718096;font-size:12px}.bar{height:7px;margin:28px 0 18px;overflow:hidden;border-radius:99px;background:#e3ebf5}.bar::after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#0ea5b7);animation:loading 1.15s ease-in-out infinite alternate}.status{margin:0;color:#536a86;font-size:13px;line-height:1.6}.error{color:#b42334;white-space:pre-wrap}@keyframes loading{from{transform:translateX(-30%)}to{transform:translateX(190%)}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">∿</div><div><h1>LC-MS/MS 分析平台</h1><p class="sub">单机离线桌面版</p></div></div>
    <div class="bar" aria-hidden="true"></div>
    <p id="status" class="status">正在检查本地运行环境…</p>
  </main>
  <script>
    const status = document.getElementById("status");
    window.lcmsDesktop?.onBackendStatus(payload => {
      status.textContent = payload?.message || "正在启动…";
      status.classList.toggle("error", payload?.kind === "error");
    });
  </script>
</body>
</html>
